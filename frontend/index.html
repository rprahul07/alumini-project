<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CUCEK Alumni" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Critical resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="//alumniblob.blob.core.windows.net">
    <!-- Critical JavaScript preloading -->
    <link rel="modulepreload" href="/src/main.jsx">
    <link rel="modulepreload" href="/src/App.jsx">
    <link rel="modulepreload" href="/src/routes/index.jsx">
    <link rel="modulepreload" href="/src/pages/EventsPage.jsx">
    <link rel="modulepreload" href="/src/components/EventGrid.jsx">
    <link rel="modulepreload" href="/src/components/EventCard.jsx">
    <link rel="modulepreload" href="/src/components/OptimizedImage.jsx">
    <link rel="modulepreload" href="/src/contexts/AuthContext.jsx">
    <link rel="modulepreload" href="/src/config/axios.js">
    <link rel="modulepreload" href="/src/components/Navbar.jsx">
    
    <!-- Critical CSS preloading -->
    <link rel="preload" href="/src/index.css" as="style">
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <!-- Removed render-blocking Bootstrap Icons CSS to improve FCP/LCP -->
    <title>CUCEK Alumni Connect</title>
    <meta name="description" content="Connect with CUCEK alumni worldwide. Build meaningful connections, share experiences, and explore opportunities together.">
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical styles for initial render */
      body { 
        margin: 0; 
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        color: white;
      }
      #root { 
        width: 100%; 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
      }
      .loading-spinner { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      }
      .spinner { 
        width: 40px; 
        height: 40px; 
        border: 4px solid #f3f3f3; 
        border-top: 4px solid #059669; 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
      }
      @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
      }
      /* Critical navbar styles */
      .navbar { 
        background: rgba(15, 23, 42, 0.95); 
        backdrop-filter: blur(10px); 
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Critical event card styles */
      .event-card { 
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(10px); 
        border-radius: 12px; 
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
