<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CUCEK Alumni" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Critical resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="//alumniblob.blob.core.windows.net">
    
    <!-- Preload critical fonts -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style">
    <!-- Preload FontAwesome to reduce LCP -->
    <link rel="preload" href="/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin="anonymous">
    <!-- Removed render-blocking Bootstrap Icons CSS to improve FCP/LCP -->
    <title>CUCEK Alumni Connect</title>
    <meta name="description" content="Connect with CUCEK alumni worldwide. Build meaningful connections, share experiences, and explore opportunities together.">
    <!-- Critical CSS for above-the-fold content -->
    <style>
      /* Critical styles for initial render */
      body { 
        margin: 0; 
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        color: white;
      }
      
      /* Font loading optimization to prevent layout shifts */
      @font-face {
        font-family: 'Font Awesome 6 Free';
        font-style: normal;
        font-weight: 900;
        font-display: swap;
        src: url('/webfonts/fa-solid-900.woff2') format('woff2');
      }
      #root { 
        width: 100%; 
        min-height: 100vh; 
        display: flex;
        flex-direction: column;
      }
      .loading-spinner { 
        display: flex; 
        justify-content: center; 
        align-items: center; 
        height: 100vh; 
        background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
      }
      .spinner { 
        width: 40px; 
        height: 40px; 
        border: 4px solid #f3f3f3; 
        border-top: 4px solid #059669; 
        border-radius: 50%; 
        animation: spin 1s linear infinite; 
      }
      @keyframes spin { 
        0% { transform: rotate(0deg); } 
        100% { transform: rotate(360deg); } 
      }
      /* Critical navbar styles */
      .navbar { 
        background: rgba(15, 23, 42, 0.95); 
        backdrop-filter: blur(10px); 
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Critical event card styles */
      .event-card { 
        background: rgba(255, 255, 255, 0.1); 
        backdrop-filter: blur(10px); 
        border-radius: 12px; 
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      
      /* Prevent layout shifts during font loading */
      .fa, .fas, .far, .fab {
        font-family: 'Font Awesome 6 Free', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-style: normal;
        font-variant: normal;
        text-rendering: auto;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Reserve space for icons to prevent CLS */
      .icon-placeholder {
        display: inline-block;
        width: 1em;
        height: 1em;
        background: currentColor;
        opacity: 0.1;
      }
      
      /* Disable animations that cause CLS */
      .animate-pulse, .animate-bounce {
        animation: none !important;
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      
      /* Reserve space for animated orbs to prevent CLS */
      .gradient-orb {
        position: absolute;
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
        animation: none !important;
      }
      
      /* Prevent layout shifts from floating particles */
      .floating-particle {
        position: absolute;
        will-change: auto;
        transform: translateZ(0);
        backface-visibility: hidden;
        animation: none !important;
      }
      
      /* Force layout stability */
      * {
        box-sizing: border-box;
      }
      
      /* Prevent layout shifts from images */
      img {
        height: auto;
        max-width: 100%;
        display: block;
      }
      
      /* Reserve space for sections to prevent CLS */
      section {
        contain: layout style;
      }
      
      /* Disable all animations during initial load to prevent CLS */
      @media (prefers-reduced-motion: no-preference) {
        .no-animation * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
      
      /* Force stable layout */
      .stable-layout {
        contain: layout style paint;
        will-change: auto;
      }
    </style>
  </head>
  <body>
    <div id="root" class="stable-layout">
      <!-- Static Loading Spinner for immediate feedback -->
      <div class="loading-spinner">
        <div class="spinner"></div>
      </div>
    </div>
    <div id="modal-root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
